name: Deploy to WordPress.org

# Push a version tag (e.g. 1.2.1) that matches the plugin header and the readme's
# Stable tag, and this publishes it to plugins.svn.wordpress.org.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        id: check
        run: |
          command -v svn >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq subversion >/dev/null; }
          slug="${GITHUB_REPOSITORY#*/}"
          tag="${GITHUB_REF_NAME}"
          header=$(grep -m1 -iE '^\s*\*?\s*Version:' "$slug.php" | sed -E 's/.*Version:\s*//I' | tr -d '[:space:]')
          stable=$(grep -m1 -i 'Stable tag:' readme.txt | sed -E 's/.*Stable tag:\s*//I' | tr -d '[:space:]')
          echo "tag=$tag header=$header stable=$stable"
          [ "$tag" = "$header" ] && [ "$tag" = "$stable" ] || { echo "::error::Tag, plugin header and Stable tag must all match"; exit 1; }
          if svn ls "https://plugins.svn.wordpress.org/$slug/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already on WordPress.org (released locally with wp-release), nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
